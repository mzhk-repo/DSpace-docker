name: App Pipeline

on:
  push:
    branches: [ dev, main ]
    paths-ignore:
      - '**/*.md'
      - '.env.example'
      - '.gitignore'
  pull_request:
    branches: [ dev, main ]
    paths-ignore:
      - '**/*.md'
      - '.env.example'
      - '.gitignore'
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  deploy-change-check:
    runs-on: ubuntu-latest
    outputs:
      deploy_allowed: ${{ steps.check.outputs.deploy_allowed }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether deployment is allowed
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            echo "deploy_allowed=true" >> "$GITHUB_OUTPUT"
            echo "Release event: deployment remains allowed"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          else
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          deploy_allowed=true
          for path in "${changed_files[@]}"; do
            case "$path" in
              # Operational/manual scripts: CI still runs, CD must be skipped.
              scripts/backup-dspace.sh|
              scripts/lib/backup-*.sh|
              scripts/lib/autonomous-env.sh|
              scripts/lib/docker-runtime.sh|
              scripts/cleanup-assetstore-orphans.sh|
              scripts/generate-item-thumbnail.sh|
              scripts/restore-backup.sh|
              scripts/run-maintenance.sh|
              scripts/sync-user-groups.sh|
              scripts/test-restore.sh|
              docs/**)
                ;;
              *)
                deploy_allowed=false
                break
                ;;
            esac
          done

          echo "Changed files:"
          printf ' - %s\n' "${changed_files[@]}"
          echo "deploy_allowed=$deploy_allowed" >> "$GITHUB_OUTPUT"
          echo "Deployment allowed: $deploy_allowed"

  deploy-dev:
    needs: deploy-change-check
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    uses: mzhk-repo/shared-workflows/.github/workflows/shared-ci-cd.yml@main
    with:
      environment_name: development
      deploy: ${{ needs.deploy-change-check.outputs.deploy_allowed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
      use_ansible: true
      build_and_push_docker: false
      docker_image_name: dspace-docker
      orchestration_script_path: 'scripts/deploy-orchestrator-swarm.sh'
      infra_repo_path: '/opt/Ansible'
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_HOST_KEY_PUB: ${{ secrets.SSH_HOST_KEY_PUB }}
      DEPLOY_PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  deploy-prod:
    needs: deploy-change-check
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    uses: mzhk-repo/shared-workflows/.github/workflows/shared-ci-cd.yml@main
    with:
      environment_name: production
      deploy: ${{ needs.deploy-change-check.outputs.deploy_allowed == 'true' && github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') }}
      use_ansible: true
      build_and_push_docker: false
      docker_image_name: dspace-docker
      orchestration_script_path: 'scripts/deploy-orchestrator-swarm.sh'
      infra_repo_path: '/opt/Ansible'
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_HOST_KEY_PUB: ${{ secrets.SSH_HOST_KEY_PUB }}
      DEPLOY_PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
